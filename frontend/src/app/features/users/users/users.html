<div class="page-shell">
  <div class="page-header">
    <div class="flex items-center gap-3">
      <h2 class="page-title" i18n="@@nav.users">Users</h2>
    </div>
    <div class="page-actions">
      <p-button
        label="Refresh"
        i18n-label="@@common.refresh"
        icon="pi pi-refresh"
        [loading]="loading()"
        styleClass="action-btn"
        [outlined]="true"
        severity="info"
        size="small"
        (onClick)="loadUsers()"
      />
      <p-button
        label="Add User"
        i18n-label="@@users.add"
        icon="pi pi-plus"
        severity="primary"
        size="small"
        (onClick)="openNewUser()"
      />
    </div>
  </div>

  <p-card styleClass="dashboard-card glass-surface p-0 shadow-sm">
    <div class="table-toolbar">
      <div class="table-search-shell">
        <i class="pi pi-search"></i>
        <input
          pInputText
          type="text"
          class="table-search-input"
          placeholder="Search users freely..."
          i18n-placeholder="@@users.search"
          [ngModel]="searchQuery()"
          (ngModelChange)="searchQuery.set($event)"
        />
      </div>
    </div>

    <p-table
      #dt
      [value]="filteredUsers()"
      [loading]="loading()"
      [paginator]="true"
      [rows]="10"
      [rowsPerPageOptions]="[10, 25, 50]"
      [paginatorDropdownAppendTo]="'body'"
      styleClass="dashboard-table p-datatable-sm"
      responsiveLayout="scroll"
    >
      <ng-template pTemplate="header">
        <tr>
          <th>
            <button type="button" class="inline-flex items-center gap-1.5" (click)="toggleSort('type')">
              <span i18n="@@common.type">Type</span>
              <i class="pi text-[11px]" [ngClass]="getSortIcon('type')"></i>
            </button>
          </th>
          <th>
            <button type="button" class="inline-flex items-center gap-1.5" (click)="toggleSort('username')">
              <span i18n="@@users.col.username">Username</span>
              <i class="pi text-[11px]" [ngClass]="getSortIcon('username')"></i>
            </button>
          </th>
          <th>
            <button type="button" class="inline-flex items-center gap-1.5" (click)="toggleSort('name')">
              <span i18n="@@common.name">Name</span>
              <i class="pi text-[11px]" [ngClass]="getSortIcon('name')"></i>
            </button>
          </th>
          <th>
            <button type="button" class="inline-flex items-center gap-1.5" (click)="toggleSort('company')">
              <span i18n="@@users.col.company">Company Name</span>
              <i class="pi text-[11px]" [ngClass]="getSortIcon('company')"></i>
            </button>
          </th>
          <th>
            <button type="button" class="inline-flex items-center gap-1.5" (click)="toggleSort('role')">
              <span i18n="@@users.col.role">Role</span>
              <i class="pi text-[11px]" [ngClass]="getSortIcon('role')"></i>
            </button>
          </th>
          <th class="table-actions-col" style="width: 150px" i18n="@@common.actions">Actions</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-user>
        <tr>
          <td>
            <p-tag [value]="getUserTypeLabel(user)" [severity]="user.user_type === 'company' ? 'info' : user.user_type === 'employee' ? 'warn' : 'contrast'"></p-tag>
          </td>
          <td><span class="text-slate-600">{{ user.username || '-' }}</span></td>
          <td class="font-medium text-slate-900">{{ getDisplayName(user) }}</td>
          <td><span class="text-slate-600">{{ user.name || '-' }}</span></td>
          <td>
            <p-tag [value]="user.role" [severity]="getRoleSeverity(user.role)"></p-tag>
          </td>
          <td class="table-actions-col">
            <div class="flex gap-2">
              <p-button
                icon="pi pi-id-card"
                [rounded]="true"
                [text]="true"
                size="small"
                severity="secondary"
                [ariaLabel]="t.printBadge"
                (onClick)="printBadge(user)"
              />
              @if (canEdit(user)) {
                <p-button
                  icon="pi pi-pencil"
                  [rounded]="true"
                  [text]="true"
                  size="small"
                  severity="info"
                  (onClick)="editUser(user)"
                />
                <p-button
                  icon="pi pi-trash"
                  [rounded]="true"
                  [text]="true"
                  size="small"
                  severity="danger"
                  (onClick)="deleteUserConfirm(user)"
                />
              }
            </div>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="6" class="text-center py-8 text-slate-500">
            <i class="pi pi-users text-3xl mb-3 text-slate-300 block"></i>
            <span i18n="@@users.empty">No users found.</span>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </p-card>
</div>

<!-- Add/Edit Dialog -->
<p-dialog
  [(visible)]="dialogVisible"
  [header]="dialogMode === 'create' ? t.add : t.edit"
  [modal]="true"
  styleClass="sv-dialog sv-dialog-wide"
  appendTo="body"
  [breakpoints]="{ '1280px': '74vw', '960px': '88vw', '640px': '96vw' }"
  [draggable]="false"
  [resizable]="false"
>
  <div class="flex flex-col gap-4 py-4" *ngIf="formState">
    <div class="flex flex-col gap-2">
      <label for="user_type" class="text-sm font-semibold text-slate-700" i18n="@@users.lbl.type">User Type</label>
      <p-select
        id="user_type"
        [options]="userTypeOptions"
        [(ngModel)]="formState['user_type']"
        optionLabel="label"
        optionValue="value"
        styleClass="w-full"
        (onChange)="onUserTypeChange($event.value)"
      />
    </div>

    @if (formState['user_type'] !== 'company') {
    <div class="grid grid-cols-2 gap-4">
      <div class="flex flex-col gap-2">
        <label for="first_name" class="text-sm font-semibold text-slate-700"><span i18n="@@users.lbl.firstName">First Name</span> <span class="text-red-500">*</span></label>
        <input id="first_name" type="text" pInputText [(ngModel)]="formState.first_name" placeholder="John" />
      </div>
      <div class="flex flex-col gap-2">
        <label for="last_name" class="text-sm font-semibold text-slate-700" i18n="@@users.lbl.lastName">Last Name</label>
        <input id="last_name" type="text" pInputText [(ngModel)]="formState.last_name" placeholder="Doe" />
      </div>
    </div>
    } @else {
      <div class="flex flex-col gap-2">
        <label for="company_name" class="text-sm font-semibold text-slate-700"><span i18n="@@users.col.company">Company Name</span> <span class="text-red-500">*</span></label>
        <input id="company_name" type="text" pInputText [(ngModel)]="formState['name']" placeholder="Company Ltd" />
      </div>
    }

    <div class="flex flex-col gap-2">
      <label for="user_notes" class="text-sm font-semibold text-slate-700" i18n="@@common.notes">Notes</label>
      <textarea id="user_notes" pTextarea [(ngModel)]="formState['notes']" rows="3" placeholder="Optional notes..." i18n-placeholder="@@common.ph.notes"></textarea>
    </div>
  </div>

  <ng-template pTemplate="footer">
    <div class="flex justify-end gap-2">
      <p-button label="Cancel" i18n-label="@@common.cancel" icon="pi pi-times" [text]="true" severity="secondary" (onClick)="hideDialog()" />
      <p-button label="Save" i18n-label="@@common.save" icon="pi pi-check" (onClick)="saveUser()" [loading]="saving()" />
    </div>
  </ng-template>
</p-dialog>
