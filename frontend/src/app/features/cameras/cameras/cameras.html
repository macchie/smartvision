<div class="page-shell">
  <div class="page-header">
    <div class="flex items-center gap-3">
      <h2 class="page-title" i18n="@@nav.cameras">Cameras</h2>
    </div>
    <div class="page-actions">
      <p-button
        label="Refresh"
        i18n-label="@@common.refresh"
        icon="pi pi-refresh"
        [loading]="loading()"
        styleClass="action-btn"
        [outlined]="true"
        severity="info"
        size="small"
        (onClick)="loadCameras()"
      />
      <p-button
        label="Add Camera"
        i18n-label="@@cameras.add"
        icon="pi pi-plus"
        severity="primary"
        size="small"
        (onClick)="openNewCamera()"
      />
    </div>
  </div>

  <p-card styleClass="dashboard-card glass-surface p-0 shadow-sm">
    <div class="table-toolbar">
      <div class="table-search-shell">
        <i class="pi pi-search"></i>
        <input
          pInputText
          type="text"
          class="table-search-input"
          placeholder="Search cameras freely..."
          i18n-placeholder="@@cameras.search"
          [ngModel]="searchQuery()"
          (ngModelChange)="searchQuery.set($event)"
        />
      </div>
    </div>

    <p-table
      #dt
      [value]="filteredCameras()"
      [loading]="loading()"
      [paginator]="true"
      [rows]="10"
      [rowsPerPageOptions]="[10, 25, 50]"
      [paginatorDropdownAppendTo]="'body'"
      styleClass="dashboard-table p-datatable-sm"
      responsiveLayout="scroll"
    >
      <ng-template pTemplate="header">
        <tr>
          <th>
            <button type="button" class="inline-flex items-center gap-1.5" (click)="toggleSort('name')">
              <span i18n="@@common.name">Name</span>
              <i class="pi text-[11px]" [ngClass]="getSortIcon('name')"></i>
            </button>
          </th>
          <th>
            <button type="button" class="inline-flex items-center gap-1.5" (click)="toggleSort('direction')">
              <span i18n="@@field.direction">Direction</span>
              <i class="pi text-[11px]" [ngClass]="getSortIcon('direction')"></i>
            </button>
          </th>
          <th>
            <button type="button" class="inline-flex items-center gap-1.5" (click)="toggleSort('enabled')">
              <span i18n="@@common.enabled">Enabled</span>
              <i class="pi text-[11px]" [ngClass]="getSortIcon('enabled')"></i>
            </button>
          </th>
          <th class="table-actions-col" style="width: 120px" i18n="@@common.actions">Actions</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-camera>
        <tr>
          <td class="font-medium text-slate-900">{{ camera.name }}</td>
          <td>
            <span
              class="text-sm font-semibold"
              [ngClass]="camera.direction === 'out' ? 'text-orange-600' : (camera.direction === 'checkpoint' ? 'text-blue-600' : 'text-emerald-600')"
            >
              {{ directionLabel(camera.direction) }}
            </span>
          </td>
          <td>
            <p-tag [value]="camera.enabled ? t.yes : t.no" [severity]="camera.enabled ? 'success' : 'secondary'"></p-tag>
          </td>
          <td class="table-actions-col">
            <div class="flex gap-2">
              <p-button
                icon="pi pi-pencil"
                [rounded]="true"
                [text]="true"
                size="small"
                severity="info"
                (onClick)="editCamera(camera)"
              />
              <p-button
                icon="pi pi-trash"
                [rounded]="true"
                [text]="true"
                size="small"
                severity="danger"
                (onClick)="deleteCameraConfirm(camera)"
              />
            </div>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="4" class="text-center py-8 text-slate-500">
            <i class="pi pi-camera text-3xl mb-3 text-slate-300 block"></i>
            <span i18n="@@cameras.empty">No cameras found. Add one to get started.</span>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </p-card>
</div>

<!-- Add/Edit Dialog -->
<p-dialog
  [(visible)]="dialogVisible"
  [header]="dialogMode === 'create' ? t.add : t.edit"
  [modal]="true"
  styleClass="sv-dialog"
  appendTo="body"
  [breakpoints]="{ '1280px': '68vw', '960px': '82vw', '640px': '96vw' }"
  [draggable]="false"
  [resizable]="false"
>
  <div class="flex flex-col gap-4 py-4" *ngIf="formState">
    <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
      <div class="flex flex-col gap-2">
        <label for="name" class="text-sm font-semibold text-slate-700"><span i18n="@@cameras.lbl.name">Camera Name</span> <span class="text-red-500">*</span></label>
        <input id="name" type="text" pInputText [(ngModel)]="formState.name" placeholder="e.g. Main Gate Entry" i18n-placeholder="@@cameras.ph.name" />
      </div>

      <div class="flex flex-col gap-2">
        <label for="camera_id" class="text-sm font-semibold text-slate-700"><span i18n="@@cameras.lbl.id">Camera ID</span> <span class="text-red-500">*</span></label>
        <input id="camera_id" type="text" pInputText [(ngModel)]="formState.camera_id" placeholder="e.g. cam-main-entry" />
      </div>
    </div>

    <div class="flex flex-col gap-2">
      <label for="direction" class="text-sm font-semibold text-slate-700"><span i18n="@@field.direction">Direction</span> <span class="text-red-500">*</span></label>
      <p-select
        id="direction"
        [options]="directionOptions"
        [(ngModel)]="formState.direction"
        optionLabel="label"
        optionValue="value"
        appendTo="body"
        styleClass="w-full"
      />
    </div>

    <div class="flex flex-col gap-2">
      <label for="metadata" class="text-sm font-semibold text-slate-700" i18n="@@cameras.lbl.metadata">Metadata (JSON)</label>
      <textarea id="metadata" pTextarea [(ngModel)]="formState.metadataText" rows="4" placeholder='{"ip":"10.0.0.1","zone":"north-gate"}'></textarea>
    </div>

    <div class="flex flex-col gap-2">
      <label for="notes" class="text-sm font-semibold text-slate-700" i18n="@@common.notes">Notes</label>
      <textarea id="notes" pTextarea [(ngModel)]="formState.notes" rows="3" placeholder="Optional details about location or purpose..." i18n-placeholder="@@cameras.ph.notes"></textarea>
    </div>

    <div class="flex items-center gap-2 mt-1">
      <input type="checkbox" id="camera_enabled" [(ngModel)]="formState['enabled']" class="h-4 w-4 rounded border-slate-300 text-blue-600 focus:ring-blue-600" />
      <label for="camera_enabled" class="text-sm font-semibold text-slate-700" i18n="@@common.enabled">Enabled</label>
    </div>
  </div>

  <ng-template pTemplate="footer">
    <div class="flex justify-end gap-2">
      <p-button label="Cancel" i18n-label="@@common.cancel" icon="pi pi-times" [text]="true" severity="secondary" (onClick)="hideDialog()" />
      <p-button label="Save" i18n-label="@@common.save" icon="pi pi-check" (onClick)="saveCamera()" [loading]="saving()" />
    </div>
  </ng-template>
</p-dialog>
