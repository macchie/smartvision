<div class="dashboard-shell">
  <header class="dashboard-topbar px-4 py-3 md:px-8 md:py-4">
    <div class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3 md:gap-4">
        <a routerLink="/dashboard" class="brand-mark flex h-9 w-9 items-center justify-center bg-gradient-to-br from-slate-700 to-blue-600 text-white shadow-sm shadow-slate-900/20 md:h-10 md:w-10">
          <i class="pi pi-camera text-sm"></i>
        </a>
        <div class="hidden sm:block">
          <p class="text-[11px] font-bold uppercase tracking-[0.2em] text-blue-700/90 dark:text-blue-300/90 md:text-xs">SmartVision</p>
          <a routerLink="/dashboard"><h1 class="text-lg font-black tracking-tight text-slate-900 dark:text-slate-100 md:text-2xl" i18n="@@nav.dashboard">Dashboard</h1></a>
        </div>
      </div>

      <div class="flex items-center gap-2 md:ml-auto md:gap-3">
        <!-- Desktop navigation links -->
        <nav class="top-nav hidden md:flex gap-1.5 border border-slate-200/70 bg-white/85 p-1 shadow-sm backdrop-blur dark:border-white/10 dark:bg-white/5">
          <a class="top-nav-link p-button p-component p-button-text p-button-sm font-semibold rounded-xl no-underline text-slate-600 hover:bg-slate-100 hover:text-slate-900 dark:text-slate-300 dark:hover:bg-white/10 dark:hover:text-white px-3 py-2 transition-colors" routerLink="/dashboard" routerLinkActive="active-nav" [routerLinkActiveOptions]="{exact: true}" i18n="@@nav.dashboard">Dashboard</a>
          <a class="top-nav-link p-button p-component p-button-text p-button-sm font-semibold rounded-xl no-underline text-slate-600 hover:bg-slate-100 hover:text-slate-900 dark:text-slate-300 dark:hover:bg-white/10 dark:hover:text-white px-3 py-2 transition-colors" routerLink="/cameras" routerLinkActive="active-nav" [routerLinkActiveOptions]="{exact: true}" i18n="@@nav.cameras">Cameras</a>
          <a class="top-nav-link p-button p-component p-button-text p-button-sm font-semibold rounded-xl no-underline text-slate-600 hover:bg-slate-100 hover:text-slate-900 dark:text-slate-300 dark:hover:bg-white/10 dark:hover:text-white px-3 py-2 transition-colors" routerLink="/rooms" routerLinkActive="active-nav" [routerLinkActiveOptions]="{exact: true}" i18n="@@nav.rooms">Rooms</a>
          <a class="top-nav-link p-button p-component p-button-text p-button-sm font-semibold rounded-xl no-underline text-slate-600 hover:bg-slate-100 hover:text-slate-900 dark:text-slate-300 dark:hover:bg-white/10 dark:hover:text-white px-3 py-2 transition-colors" routerLink="/access-logs" routerLinkActive="active-nav" [routerLinkActiveOptions]="{exact: true}" i18n="@@nav.accessLogs">Access Logs</a>
          <a class="top-nav-link p-button p-component p-button-text p-button-sm font-semibold rounded-xl no-underline text-slate-600 hover:bg-slate-100 hover:text-slate-900 dark:text-slate-300 dark:hover:bg-white/10 dark:hover:text-white px-3 py-2 transition-colors" routerLink="/vehicles" routerLinkActive="active-nav" [routerLinkActiveOptions]="{exact: true}" i18n="@@nav.vehicles">Vehicles</a>
          <a class="top-nav-link p-button p-component p-button-text p-button-sm font-semibold rounded-xl no-underline text-slate-600 hover:bg-slate-100 hover:text-slate-900 dark:text-slate-300 dark:hover:bg-white/10 dark:hover:text-white px-3 py-2 transition-colors" routerLink="/users" routerLinkActive="active-nav" [routerLinkActiveOptions]="{exact: true}" i18n="@@nav.users">Users</a>
        </nav>

        <button
          type="button"
          class="theme-toggle inline-flex h-9 w-9 items-center justify-center rounded-full border border-slate-200/80 bg-white/95 text-slate-600 transition-colors hover:bg-slate-100 hover:text-slate-900 dark:border-white/10 dark:bg-white/5 dark:text-slate-300 dark:hover:bg-white/10 dark:hover:text-white md:h-10 md:w-10"
          (click)="toggleTheme()"
          [attr.aria-pressed]="themeService.isDark()"
          [attr.aria-label]="themeService.isDark() ? lightModeLabel : darkModeLabel"
        >
          <i class="pi" [ngClass]="themeService.isDark() ? 'pi-sun' : 'pi-moon'"></i>
        </button>

        <button
          type="button"
          pButton
          class="user-menu-trigger !rounded-full !border !border-slate-200/80 !bg-white/95 dark:!border-white/10 dark:!bg-white/5 !px-2 !py-1.5"
          (click)="toggleUserMenu($event)"
          [attr.aria-label]="userMenuLabel"
        >
          <div class="flex items-center gap-2">
            <p-avatar [label]="authService.userInitials" shape="circle" styleClass="!bg-slate-900 !text-white" />
            <i class="pi pi-angle-down text-xs text-slate-500"></i>
          </div>
        </button>

        <p-menu #userMenu [popup]="true" [model]="userMenuItems()" appendTo="body"></p-menu>
      </div>
    </div>
  </header>

  <div class="dashboard-content mx-auto max-w-7xl space-y-5 p-4 pb-mobile-nav md:space-y-6 md:p-8">
    <router-outlet></router-outlet>
  </div>

  <nav class="mobile-bottom-nav md:hidden" aria-label="Primary mobile navigation">
    <a class="mobile-tab-link" routerLink="/dashboard" routerLinkActive="active-nav" [routerLinkActiveOptions]="{exact: true}">
      <i class="pi pi-home"></i>
      <span i18n="@@nav.home">Home</span>
    </a>
    <a class="mobile-tab-link" routerLink="/cameras" routerLinkActive="active-nav" [routerLinkActiveOptions]="{exact: true}">
      <i class="pi pi-video"></i>
      <span i18n="@@nav.cameras">Cameras</span>
    </a>
    <a class="mobile-tab-link" routerLink="/rooms" routerLinkActive="active-nav" [routerLinkActiveOptions]="{exact: true}">
      <i class="pi pi-building"></i>
      <span i18n="@@nav.rooms">Rooms</span>
    </a>
    <a class="mobile-tab-link" routerLink="/access-logs" routerLinkActive="active-nav" [routerLinkActiveOptions]="{exact: true}">
      <i class="pi pi-history"></i>
      <span i18n="@@nav.logs">Logs</span>
    </a>
    <a class="mobile-tab-link" routerLink="/vehicles" routerLinkActive="active-nav" [routerLinkActiveOptions]="{exact: true}">
      <i class="pi pi-car"></i>
      <span i18n="@@nav.vehicles">Vehicles</span>
    </a>
    <a class="mobile-tab-link" routerLink="/users" routerLinkActive="active-nav" [routerLinkActiveOptions]="{exact: true}">
      <i class="pi pi-users"></i>
      <span i18n="@@nav.users">Users</span>
    </a>
  </nav>

  <app-settings-dialog [(visible)]="settingsVisible" />
</div>
